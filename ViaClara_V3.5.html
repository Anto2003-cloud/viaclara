<style>
:root{
  --bg:#f5f5f7; --card:#fff; --text:#1d1d1f; --muted:#6e6e73;
  --line:rgba(0,0,0,.08); --blue:#0071e3; --green:#34c759;
  --amber:#ff9f0a; --red:#ff3b30; --purple:#bf5af2;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif;
  --mono:"SF Mono",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;margin:0;padding:0;font-family:var(--font);background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input,select,textarea{font:inherit}

/* —— Apple-like top pill nav —— */
.topbar{
  position:fixed !important;
  top:0 !important;
  left:0 !important;
  right:0 !important;
  z-index:10000 !important;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  min-height:56px;
  padding:0 16px;
  padding-top:env(safe-area-inset-top, 0px);
  background:#f5f5f7 !important;
  border-bottom:1px solid rgba(0,0,0,.08);
  /* evita bug iOS: fixed + filter/backdrop */
  -webkit-backface-visibility:hidden;
  backface-visibility:hidden;
}
.topbar .navpill{position:relative;z-index:10001;flex:1;min-width:0}
.leaflet-top,.leaflet-bottom{z-index:500 !important}
.leaflet-control-zoom{
  margin-top:12px !important;
  margin-left:12px !important;
  border:0 !important;
  box-shadow:0 1px 4px rgba(0,0,0,.10) !important;
}
.leaflet-control-zoom a{
  width:34px !important;height:34px !important;line-height:34px !important;
  font-size:18px !important;color:#1d1d1f !important;
  background:#fff !important;border:0 !important;
}
.leaflet-control-zoom a:first-child{border-radius:10px 10px 0 0 !important}
.leaflet-control-zoom a:last-child{border-radius:0 0 10px 10px !important}
/* spacer bajo la barra fija */
.top-spacer{height:calc(56px + env(safe-area-inset-top, 0px));flex-shrink:0}

.navpill{
  display:flex;align-items:center;justify-content:center;gap:2px;padding:4px;
  background:rgba(0,0,0,.05); border-radius:980px;
  max-width:100%; overflow-x:auto;
}
.navpill button{
  border:0;background:transparent;color:var(--muted);
  padding:8px 14px;border-radius:980px;font-size:13px;font-weight:500;
  cursor:pointer;white-space:nowrap;transition:.15s;
}
.navpill button:hover{color:var(--text)}
.navpill button.on{background:#1d1d1f;color:#fff}
.top-right{
  display:flex;gap:8px;align-items:center;flex-shrink:0;
}
.top-left{
  display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px;flex-shrink:0;
}
.top-left .mark{
  width:26px;height:26px;border-radius:7px;background:var(--blue);
  color:#fff;font-size:10px;font-weight:700;
  display:flex;align-items:center;justify-content:center;
}
.ghost{
  border:0;background:transparent;color:var(--blue);
  font-size:13px;font-weight:500;cursor:pointer;padding:6px 10px;border-radius:8px;
}
.ghost:hover{background:rgba(0,113,227,.08)}

.wrap{max-width:1200px;margin:0 auto;padding:12px 20px 40px}

/* Hero / page title */
.hero{margin:12px 0 20px}
.hero .eye{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.02em}
.hero h1{font-size:28px;font-weight:650;letter-spacing:-.03em;margin-top:2px}
.hero p{font-size:14px;color:var(--muted);margin-top:6px;max-width:560px;line-height:1.4}

/* Cards */
.card{
  background:var(--card); border-radius:10px;
  border:1px solid var(--line);
  box-shadow:none;
  overflow:hidden; margin-bottom:14px;
}
.card-pad{padding:18px 20px}
.card-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:12px}
.card-h h2{font-size:17px;font-weight:600;letter-spacing:-.02em}
.card-h .sub{font-size:13px;color:var(--muted);margin-top:2px}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid4{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(min-width:960px){.grid4{grid-template-columns:repeat(4,1fr)}}
@media(max-width:800px){
  .grid2{grid-template-columns:1fr}
  .top-left{display:none}
  .topbar{min-height:52px;gap:6px}
  .navpill button{padding:8px 11px;font-size:12px}
  .wrap{padding-left:14px;padding-right:14px}
  .top-right .ghost{padding:6px 8px;font-size:12px}
}

.map{height:300px;background:#e8eef4;border-radius:0 0 12px 12px}
.map.lg{height:min(520px,58vh)}
.map .leaflet-container{height:100%;width:100%;background:#e8eef4}
.map-legend{
  display:flex;flex-wrap:wrap;gap:10px 18px;padding:12px 16px;
  border-top:1px solid var(--line);font-size:12px;color:var(--text);
  background:#fafafa;align-items:center;
}
.map-legend span{display:flex;align-items:center;gap:7px;white-space:nowrap;font-weight:500}
.map-legend i{
  width:14px;height:8px;border-radius:3px;flex-shrink:0;display:inline-block;
  box-shadow:0 0 0 1px rgba(0,0,0,.12);
}

.metrics{display:flex;gap:8px;flex-wrap:wrap;padding:12px 16px;border-top:1px solid var(--line)}
.metric{flex:1;min-width:72px}
.metric .l{font-size:11px;color:var(--muted);font-weight:500}
.metric .v{font-family:var(--mono);font-size:20px;font-weight:500;letter-spacing:-.02em;margin-top:2px}
.metric .v.bad{color:var(--red)} .metric .v.good{color:var(--green)}

.btn{
  border:0;border-radius:12px;padding:11px 18px;font-size:14px;font-weight:560;
  cursor:pointer;transition:transform .1s, background .15s;
}
.btn:active{transform:scale(.98)}
.btn-p{background:var(--blue);color:#fff}
.btn-p:hover{filter:brightness(1.05)}
.btn-p:disabled{opacity:.45;cursor:wait}
.btn-s{background:rgba(0,0,0,.05);color:var(--text)}
.btn-s:hover{background:rgba(0,0,0,.08)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.item{
  display:flex;align-items:center;gap:12px;padding:10px 12px;
  border-radius:12px;cursor:pointer;user-select:none;
}
.item:hover{background:rgba(0,0,0,.03)}
.item.on{background:rgba(0,113,227,.07)}
.item b{display:block;font-size:13.5px;font-weight:560}
.item small{display:block;font-size:12px;color:var(--muted);margin-top:1px}
.sw{
  width:42px;height:26px;border-radius:13px;background:#e5e5ea;
  position:relative;flex-shrink:0;transition:.2s;
}
.sw i{position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:50%;
  background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.15);transition:transform .2s;display:block}
.item.on .sw{background:var(--green)}
.item.on .sw i{transform:translateX(16px)}

.badge{font-size:10px;font-weight:700;padding:3px 8px;border-radius:6px;letter-spacing:.02em}
.badge.crit{background:#fef2f2;color:#b91c1c}
.badge.high{background:#fff7ed;color:#c2410c}
.badge.ok{background:#ecfdf5;color:#047857}
.badge.pend{background:#eff6ff;color:#1d4ed8}

.chip{font-size:11px;padding:4px 8px;border-radius:8px;background:rgba(0,0,0,.04);color:var(--muted)}

/* AI sheet (bottom sheet / drawer — clear open/close) */
.sheet-back{position:fixed;inset:0;background:rgba(0,0,0,.25);z-index:80;opacity:0;pointer-events:none;transition:opacity .25s}
.sheet-back.show{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;left:50%;bottom:0;transform:translateX(-50%) translateY(110%);
  width:min(440px,100%); max-height:78vh;
  background:#fff; border-radius:12px 12px 0 0; z-index:90;
  box-shadow:0 -2px 16px rgba(0,0,0,.09);
  display:flex;flex-direction:column;
  transition:transform .35s cubic-bezier(.32,.72,0,1);
}
.sheet.open{transform:translateX(-50%) translateY(0)}
.sheet-h{padding:14px 16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
.sheet-h .grab{width:36px;height:4px;background:#d1d1d6;border-radius:2px;margin:0 auto 8px;display:block}
.sheet-h h3{font-size:15px;font-weight:600;flex:1}
.sheet-h .x{width:30px;height:30px;border:0;border-radius:50%;background:rgba(0,0,0,.06);cursor:pointer;font-size:14px}
.stream{flex:1;overflow-y:auto;padding:12px 16px;font-size:13px;line-height:1.5}
.msg{margin-bottom:12px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.msg .t{font-family:var(--mono);font-size:10px;color:var(--muted)}
.msg .r{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;margin-right:6px}
.msg .r.m{color:var(--blue)} .msg .r.a{color:#9333ea} .msg .r.s{color:var(--amber)} .msg .r.o{color:var(--green)} .msg .r.u{color:var(--muted)}
.ask{padding:12px 16px 20px;border-top:1px solid var(--line)}
.ask textarea{width:100%;min-height:48px;border:0;background:rgba(0,0,0,.04);border-radius:12px;padding:11px;margin-bottom:8px;resize:vertical}

.fab{
  position:fixed;bottom:20px;right:20px;z-index:60;
  width:52px;height:52px;border-radius:50%;border:0;
  background:var(--blue);color:#fff;font-weight:700;font-size:12px;
  box-shadow:0 8px 28px rgba(0,113,227,.35);cursor:pointer;
}
.fab:hover{filter:brightness(1.06)}

/* Banner de notificación EN FLUJO (reemplaza el toast flotante).
   Nunca usa position:fixed ni absolute: ocupa espacio real y empuja el contenido. */
.notice-banner{
  max-width:1200px;margin:0 auto;padding:0 20px;
  max-height:0;opacity:0;overflow:hidden;
  transition:max-height .25s ease, opacity .2s ease;
}
.notice-banner.show{max-height:110px;opacity:1}
.notice-banner .nb-box{
  margin-top:12px;padding:12px 16px;border-radius:10px;
  background:#eef4ff;border:1px solid #cfe0fb;color:#1d4ed8;
  font-size:13px;line-height:1.4;display:flex;align-items:center;gap:10px;
}
.notice-banner .nb-box.warn{background:#fffaf0;border-color:#fde7c7;color:#9a5b12}
.notice-banner .nb-box.err{background:#fef2f2;border-color:#fecaca;color:#b91c1c}
.notice-banner .nb-box.ok{background:#f0fbf5;border-color:#c8f0d8;color:#0f7a45}

.field{margin-bottom:10px}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
.field input,.field select,.field textarea{
  width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14px;background:#fff
}
.list-row{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);align-items:flex-start;font-size:13px;min-width:0}
.section-divider{margin:0 0 12px;padding-top:6px}
.section-divider h2{font-size:17px;font-weight:650;margin-bottom:4px}
.section-divider p{font-size:12.5px;color:var(--muted);line-height:1.5;max-width:70ch}
.table-scroll{overflow-x:auto}
.data-table{width:100%;border-collapse:collapse;font-size:12.5px}
.data-table th{text-align:left;font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
.data-table td{padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:top}
.data-table tr:last-child td{border-bottom:none}
.cal-month-axis{display:flex;font-size:10.5px;font-weight:700;color:var(--muted);letter-spacing:.04em;margin-bottom:6px}
.alt-selected{border:1.5px solid #86868b}
.alt-selected .card-pad:first-child{background:#fafafa}
.list-row b,.list-row span,.list-row div{overflow-wrap:break-word;word-break:break-word}
.score-bar{display:inline-block;width:64px;height:6px;border-radius:99px;background:#eef0f2;overflow:hidden}
.score-bar i{display:block;height:100%;border-radius:99px}
.palette-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.palette-item{display:flex;align-items:flex-start;gap:9px;padding:9px 10px;border:1px solid var(--line);border-radius:10px;min-width:0}
.palette-swatch{width:16px;height:16px;border-radius:5px;flex-shrink:0;margin-top:1px;border:1px solid rgba(0,0,0,.08)}
.palette-text{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
.palette-label{font-size:11.5px;color:var(--text);line-height:1.35;overflow-wrap:break-word;word-break:break-word}
.palette-hex{font-family:var(--mono);font-size:10px;color:var(--muted)}
.datos-summary{
  display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:14px;
}
@media(min-width:640px){.datos-summary{grid-template-columns:repeat(4,1fr)}}
.datos-sum-card{
  padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:#fff;
}
.datos-sum-card .ds-k{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;font-weight:600}
.datos-sum-card .ds-v{font-size:22px;font-weight:650;font-family:var(--mono);margin-top:4px;line-height:1.1}
.datos-sum-card .ds-h{font-size:11.5px;color:var(--muted);margin-top:4px;line-height:1.35}
.datos-toc{
  display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px;padding:4px;
  background:rgba(0,0,0,.03);border-radius:12px;
}
.datos-toc a{
  font-size:12px;font-weight:600;padding:7px 12px;border-radius:9px;
  color:var(--muted);text-decoration:none;border:1px solid transparent;
}
.datos-toc a:hover{color:var(--text);background:#fff;border-color:var(--line)}
.datos-sec{scroll-margin-top:72px}
.multi-grid{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:720px){.multi-grid{grid-template-columns:repeat(3,1fr)}}
.multi-src{font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:1px 5px;border-radius:4px;flex-shrink:0}
.multi-src.motor{background:#eff6ff;color:#1d4ed8}
.multi-src.regla{background:#f8fafc;color:#64748b}
.multi-contrib{display:flex;height:10px;border-radius:5px;overflow:hidden;background:#eeeef0;margin:10px 0 6px;gap:1px}
.multi-contrib i{display:block;height:100%;min-width:0}
.multi-score-row{display:grid;grid-template-columns:1fr auto auto;gap:6px;align-items:center;font-size:11.5px;padding:3px 0}
.multi-score-row .ms-label{color:var(--muted);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.multi-score-row .ms-pts{font-family:var(--mono);font-weight:600;font-size:11px}
.multi-score-row .ms-contrib{font-family:var(--mono);font-size:10.5px;color:var(--muted);min-width:36px;text-align:right}
.multi-chosen{border:1.5px solid #93c5fd !important;box-shadow:0 0 0 3px rgba(37,99,235,.08)}


.list-row:last-child{border-bottom:0}
.dot{width:8px;height:8px;border-radius:50%;margin-top:5px;flex-shrink:0;background:var(--red)}
.inline-error{background:#fef2f2;border:1px solid #fecaca;color:#b91c1c;font-size:12.5px;padding:9px 12px;border-radius:8px;margin-bottom:10px}
.hyp-list{background:#fef2f2;border:1px solid #fecaca;border-radius:10px;padding:4px 12px;margin-bottom:2px}
.hyp-list .list-row{border-bottom:1px solid rgba(220,38,38,.12)}
.hyp-list .list-row:last-child{border-bottom:none}

.graph{height:260px;position:relative;background:#fafafa;border-radius:10px}
.graph-list{display:flex;flex-direction:column;gap:0;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.graph-row{display:flex;align-items:center;gap:0;padding:9px 12px;border-bottom:1px solid var(--line);background:#fff}
.graph-row:last-child{border-bottom:none}
.g-node-inline{
  flex-shrink:0;font-size:11px;font-weight:700;font-family:var(--mono);
  padding:4px 9px;border-radius:7px;background:#f1f5f9;color:#475569;
  border:1.5px solid transparent;
}
.g-node-inline.conflict{background:#fef2f2;color:#b91c1c;border-color:#fecaca}
.g-node-inline.proposed{box-shadow:0 0 0 2px #1d1d1f}
.g-line{flex:1;height:1px;background:var(--line);margin:0 10px;min-width:20px}
.g-line.conflict{background:#dc2626;height:2px}
.g-corridor{flex-shrink:0;font-size:12px;color:var(--muted);min-width:150px;text-align:right}
.empty-state{font-size:12.5px;color:var(--muted);padding:14px 2px}
.ig-section-label{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:2px 0 6px}
.impact-group{border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;background:#fafafa}
.impact-group.flagged{border-color:#fecaca;background:#fef2f2}
.ig-head{display:flex;align-items:center;gap:7px;font-size:12.5px;margin-bottom:6px}
.ig-row{display:flex;align-items:center;gap:8px;padding:4px 0;font-size:11.5px;border-top:1px solid rgba(0,0,0,.05)}
.ig-row:first-of-type{border-top:none}
.ig-id{font-family:var(--mono);font-weight:700;font-size:10.5px;background:#fff;border:1px solid var(--line);border-radius:5px;padding:1px 6px;flex-shrink:0}
.ig-id.proposed{box-shadow:0 0 0 2px #1d1d1f}
.ig-name{flex:1;color:var(--text);min-width:0}
.ig-dates{flex-shrink:0;color:var(--muted);font-size:11px}
.g-node{position:absolute;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:700;color:#fff;transform:translate(-50%,-50%)}
.g-node.main{width:60px;height:60px;background:var(--blue)}
.g-node.sec{width:46px;height:46px;background:#86868b}
.g-label{position:absolute;font-size:11px;background:#fff;border:1px solid var(--line);
  padding:4px 8px;border-radius:6px;white-space:nowrap;transform:translateY(-50%)}

.section-divider{margin:0 0 12px;padding:0 2px}
.section-divider h2{font-size:15px;font-weight:700;margin-bottom:4px}
.section-divider p{font-size:12.5px;color:var(--muted);line-height:1.5;max-width:70ch}
.cal-month-axis{display:flex;font-size:10.5px;font-weight:700;color:var(--muted);letter-spacing:.03em;margin-bottom:8px}
.cal-month-axis span{border-left:1px solid var(--line);padding-left:8px}
.cal-month-axis span:first-child{border-left:none;padding-left:0}
.portfolio-table{width:100%;border-collapse:collapse;font-size:12.5px}
.portfolio-table th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);padding:6px 10px;border-bottom:1px solid var(--line)}
.portfolio-table td{padding:10px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.portfolio-table tr:last-child td{border-bottom:none}
.status-pill{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:99px}
.status-pill.ejecucion{background:#f3e8ff;color:#7C3AED}
.status-pill.programada{background:#f1f5f9;color:#475569}
.status-pill i{width:6px;height:6px;border-radius:50%;background:currentColor}
.cal-legend{display:flex;flex-wrap:wrap;gap:14px;font-size:11px;color:var(--muted)}
.cal-legend span{display:flex;align-items:center;gap:6px}
.cal-legend i{width:8px;height:8px;border-radius:2px;display:inline-block;flex-shrink:0}

/* ===== Calendario / Gantt / Riesgo (bloque unificado) ===== */
.cal-month-axis{display:flex;font-size:10.5px;font-weight:700;color:var(--muted);letter-spacing:.03em;margin-bottom:4px}
.cal-month-axis span{border-left:1px solid var(--line);padding-left:8px;box-sizing:border-box}
.cal-month-axis span:first-child{border-left:none;padding-left:0}
.cal-week-ticks{display:flex;height:10px;margin-bottom:4px;position:relative}
.cal-week-ticks i{flex:1;border-left:1px solid rgba(0,0,0,.06);min-width:0}
.cal-week-ticks i:nth-child(7n+1){border-left-color:rgba(0,0,0,.18)}
.risk-strip{display:flex;gap:0;height:10px;border-radius:5px;overflow:hidden;margin-bottom:6px;cursor:default}
.risk-strip i{flex:1;display:block;min-width:0;transition:transform .12s ease,filter .12s ease}
.risk-strip i:hover{filter:brightness(.88);transform:scaleY(1.35);transform-origin:center}
.cal-risk-hint{font-size:11px;color:var(--muted);min-height:16px;margin-bottom:14px;font-variant-numeric:tabular-nums}

.gantt-clean{display:flex;flex-direction:column;gap:10px;padding:2px 0 4px}
.gc-row{display:grid;grid-template-columns:minmax(140px,180px) 1fr;align-items:center;gap:12px}
@media(max-width:640px){.gc-row{grid-template-columns:1fr}}
.gc-label{display:flex;flex-direction:column;gap:1px;min-width:0}
.gc-id{font-size:11.5px;font-weight:700;font-family:var(--mono);color:var(--text);letter-spacing:.01em;display:inline-flex;align-items:center;gap:6px}
.gc-name{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:180px}
.gc-dot{width:6px;height:6px;border-radius:50%;background:#1d1d1f;display:inline-block;flex-shrink:0}
.gc-track{height:12px;background:#f0f0f2;border-radius:6px;position:relative;overflow:visible}
.gc-bar{
  position:absolute;top:1px;bottom:1px;border-radius:5px;min-width:6px;
  transition:filter .12s ease; cursor:default;
}
.gc-bar:hover{filter:brightness(.92)}
.gc-bar.proposed{
  background-image:repeating-linear-gradient(-45deg,transparent,transparent 3px,rgba(255,255,255,.45) 3px,rgba(255,255,255,.45) 6px);
  box-shadow:inset 0 0 0 1.5px #1d1d1f;
}
@keyframes gcMovedPulse{
  0%{box-shadow:0 0 0 0 rgba(0,113,227,.55)}
  40%{box-shadow:0 0 0 6px rgba(0,113,227,.25)}
  100%{box-shadow:0 0 0 0 rgba(0,113,227,0)}
}
.gc-row.just-moved{
  background:linear-gradient(90deg,rgba(0,113,227,.06),transparent 60%);
  border-radius:8px;
  outline:1.5px solid rgba(0,113,227,.35);
  outline-offset:2px;
}
.gc-row.just-moved .gc-bar{
  animation:gcMovedPulse 1.4s ease-out 2;
  filter:brightness(1.05);
}
.cal-summary{
  display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;
  margin-top:14px;padding:10px 12px;border-radius:10px;
  background:#f8fafc;border:1px solid var(--line);
  font-size:12.5px;line-height:1.4;
}
.cal-summary b{font-weight:650}
.cal-summary .cs-delta{font-family:var(--mono);font-size:12px;font-weight:600}
.cal-summary .cs-delta.down{color:#047857}
.cal-summary .cs-delta.up{color:#b91c1c}
.cal-summary .cs-delta.same{color:var(--muted)}
.cal-help{
  font-size:12px;color:var(--muted);line-height:1.45;margin:0 0 12px;
  padding:8px 10px;border-radius:8px;background:#fafafa;border:1px dashed var(--line);
}
.gc-bar-dates{position:absolute;left:0;right:0;top:100%;margin-top:2px;font-size:9.5px;color:var(--muted);white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .12s}
.gc-row:hover .gc-bar-dates{opacity:1}

.cal-legend{display:flex;flex-wrap:wrap;gap:12px 16px;font-size:11px;color:var(--muted);align-items:center}
.cal-legend span{display:inline-flex;align-items:center;gap:6px}
.cal-legend i{width:10px;height:10px;border-radius:3px;display:inline-block;flex-shrink:0}
.cal-legend i.proposed-swatch{
  background:#c4b5fd;
  background-image:repeating-linear-gradient(-45deg,transparent,transparent 2px,rgba(255,255,255,.5) 2px,rgba(255,255,255,.5) 4px);
  box-shadow:inset 0 0 0 1px #1d1d1f;
}

/* Planeación anual: tarjetas mensuales */
.month-grid-clean{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media(min-width:560px){.month-grid-clean{grid-template-columns:repeat(4,1fr)}}
@media(min-width:900px){.month-grid-clean{grid-template-columns:repeat(6,1fr)}}
.month-card-clean{
  text-align:left;background:#fff;border:1px solid var(--line);border-radius:10px;
  padding:12px;cursor:pointer;font:inherit;color:inherit;transition:border-color .15s,box-shadow .15s;
}
.month-card-clean:hover{border-color:#c7c7cc}
.month-card-clean.expanded{border-color:#a1a1a6;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.mcc-top{display:flex;align-items:center;gap:6px;margin-bottom:4px}
.mcc-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.mcc-name{font-size:13px;font-weight:700;flex:1}
.mcc-score{font-size:12px;font-family:var(--mono);font-weight:600;color:var(--text)}
.mcc-tag{font-size:10.5px;font-weight:600;letter-spacing:.02em}
.mcc-detail{
  font-size:11px;color:var(--muted);line-height:1.4;margin-top:0;
  max-height:0;overflow:hidden;opacity:0;transition:max-height .2s ease,opacity .2s ease,margin-top .2s ease;
}
.month-card-clean.expanded .mcc-detail{max-height:80px;opacity:1;margin-top:7px;padding-top:7px;border-top:1px solid var(--line)}

/* Pulso visual al elegir alternativa → decisión */
@keyframes decisionPulse{
  0%{box-shadow:0 0 0 0 rgba(0,113,227,.45)}
  70%{box-shadow:0 0 0 10px rgba(0,113,227,0)}
  100%{box-shadow:0 0 0 0 rgba(0,113,227,0)}
}
#decision-card.decision-pulse{animation:decisionPulse 1.2s ease-out;border-color:#0071e3 !important}

/* Grafo de impacto: más limpio, menos ruido visual */
.impact-group{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px;background:#fff}
.impact-group.flagged{border-color:#fca5a5;background:#fff7f7}
.ig-head{display:flex;align-items:center;gap:8px;font-size:13px;margin-bottom:8px;font-weight:600}
.ig-row{display:grid;grid-template-columns:56px 1fr auto;align-items:center;gap:10px;padding:6px 0;font-size:12px;border-top:1px solid rgba(0,0,0,.04)}
.ig-row:first-of-type{border-top:none}
.ig-id{font-family:var(--mono);font-weight:700;font-size:11px;background:#f8fafc;border:1px solid var(--line);border-radius:6px;padding:2px 7px;text-align:center}
.ig-id.proposed{outline:2px solid #1d1d1f;outline-offset:1px}
.ig-name{color:var(--text);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ig-dates{color:var(--muted);font-size:11px;white-space:nowrap}

/* Expediente: bloque de bitácora de decisión */
.exp-decision-box{padding:14px 16px;border-radius:12px;border:1px solid var(--line);background:#f8fafc;margin-bottom:16px}
.exp-decision-box.ok{border-color:#bbf7d0;background:#ecfdf5}
.exp-decision-box.warn{border-color:#fde68a;background:#fffbeb}
.exp-decision-box.crit{border-color:#fecaca;background:#fef2f2}


.steps{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px}
.step{min-width:110px;padding:10px 12px;border-radius:12px;background:rgba(0,0,0,.03);font-size:11px}
.step.on{background:rgba(0,113,227,.1)}
.step .n{font-weight:700;color:var(--muted)} .step.on .n{color:var(--blue)}

.foot{text-align:center;font-size:11px;color:var(--muted);padding:20px 0 8px}


/* VíaClara Final — AI evidence / operational UI additions */
.ai-grid{display:grid;grid-template-columns:1.15fr .85fr;gap:14px}
@media(max-width:900px){.ai-grid{grid-template-columns:1fr}}
.ai-step{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.ai-step:last-child{border-bottom:0}
.ai-step .num{width:24px;height:24px;border-radius:50%;background:rgba(0,113,227,.1);color:var(--blue);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex:0 0 auto}
.ai-step b{font-size:13px}.ai-step small{display:block;color:var(--muted);font-size:11px;margin-top:2px;line-height:1.35}
.progress{height:7px;background:#eeeef0;border-radius:99px;overflow:hidden}.progress i{display:block;height:100%;background:var(--blue);border-radius:99px}
.kpi-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi{padding:11px 12px;border-radius:12px;background:rgba(0,0,0,.03)}
.kpi .k{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}.kpi .v{font-family:var(--mono);font-size:18px;margin-top:3px}
.evidence{padding:12px;border-radius:12px;background:#f8fafc;border:1px solid var(--line)}
.evidence b{font-size:12px}.evidence p{font-size:11px;color:var(--muted);line-height:1.45;margin-top:3px}
.tag-ai{display:inline-flex;align-items:center;gap:5px;font-size:10px;font-weight:700;color:#6d28d9;background:#f5f3ff;padding:4px 7px;border-radius:7px}
.compare{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.compare .box{padding:10px;border-radius:12px;background:rgba(0,0,0,.03)}
.compare .box strong{font-family:var(--mono);font-size:17px}.compare .box small{display:block;color:var(--muted);font-size:10px;margin-top:2px}


/* IA operativa (sin chatbot) */
.cam-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media(min-width:700px){.cam-grid{grid-template-columns:repeat(4,1fr)}}
.cam-card{padding:12px;border-radius:12px;background:rgba(0,0,0,.03);border:1px solid var(--line)}
.cam-card .src{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.cam-card .val{font-family:var(--mono);font-size:18px;font-weight:560;margin-top:4px}
.cam-card .hint{font-size:11px;color:var(--muted);margin-top:2px;line-height:1.3}
.rec-list{display:flex;flex-direction:column;gap:8px}
.rec-item{display:flex;gap:12px;align-items:flex-start;padding:12px;border-radius:12px;background:#f8fafc;border:1px solid var(--line)}
.rec-item .act{font-size:10px;font-weight:700;padding:3px 7px;border-radius:6px;flex-shrink:0}
.rec-item .act.close{background:#fef2f2;color:#b91c1c}
.rec-item .act.open{background:#ecfdf5;color:#047857}
.rec-item .act.route{background:#eff6ff;color:#1d4ed8}
.rec-item .act.obra{background:#fff7ed;color:#c2410c}
.rec-item b{font-size:13px;display:block}
.rec-item small{font-size:11px;color:var(--muted);display:block;margin-top:2px;line-height:1.35}
.live-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--green);margin-right:6px;box-shadow:0 0 0 3px rgba(52,199,89,.2);animation:pulse 1.6s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}


/* Simular UX fixes */
.btn-loading{display:inline-flex;align-items:center;justify-content:center;gap:8px;opacity:.92;pointer-events:none}

/* IA proactiva 24/7 */

/* Simular polish: spacing + left panel scroll */

}

}
.action-card .why-btn{

/* Live timer + historial filtros + highlight geo */

}

.ops-overline h2{font-size:18px;font-weight:650;letter-spacing:-.02em}
.ops-overline p{font-size:12px;color:var(--muted);margin-top:3px}
.ops-kpis{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:12px;
  margin:0 0 16px;
}
.ops-kpi{

.ops-kpi.state.warn .k-value{color:var(--amber)}
.ops-kpi.state.crit .k-value{color:var(--red)}
.ops-grid{

.ops-side-head{padding:16px 18px 12px}
.ops-side-foot{padding:12px 16px 16px}

  box-shadow:var(--vc-shadow);
}
.ops-results .card-h{align-items:center}
.ops-results .card-h h2{font-size:18px}
.section-divider{
  margin-top:26px !important;
  padding-top:0 !important;
}
.section-divider h2{font-size:18px}
.decision-sticky-cta{
  border-radius:16px !important;
  box-shadow:0 8px 28px rgba(0,0,0,.07);
}
.decision-anchor{

}
.ops-history{border-radius:16px !important;box-shadow:var(--vc-shadow)}
.map-legend{background:#fafafa}
.action-card{border-radius:14px;box-shadow:0 3px 14px rgba(0,0,0,.035)}
.action-card.prio1{box-shadow:inset 3px 0 0 var(--red),0 3px 14px rgba(0,0,0,.035)}
.action-card.prio2{box-shadow:inset 3px 0 0 var(--amber),0 3px 14px rgba(0,0,0,.035)}
.action-card.prio3{box-shadow:inset 3px 0 0 var(--blue),0 3px 14px rgba(0,0,0,.035)}
.btn{min-height:40px}
@media(max-width:900px){
  .ops-kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .ops-grid{grid-template-columns:1fr}
  .ops-map-card{order:1}.ops-side{order:2}
}
@media(max-width:600px){
  .hero.ops-hero h1{font-size:27px}
  .hero.ops-hero p{font-size:13px}

  .ops-status .meta{min-width:0;flex-basis:100%}

  .action-card .acts button{flex:1;min-width:120px}
}
@media(max-width:380px){
  .ops-kpis{grid-template-columns:1fr}
  .ops-kpi .k-value{font-size:21px}
  .ops-map-card .map.lg{height:48vh;min-height:300px}
}


/* =========================================================
   VíaClara — Rediseño de presentación V4.1
   Solo capa visual. No modifica lógica ni IDs existentes.
   ========================================================= */

:root{
  --vc-bg:#f5f7fa;
  --vc-card:#ffffff;
  --vc-border:#e3e7ed;
  --vc-ink:#172033;
  --vc-muted:#667085;
  --vc-blue:#1769e0;
  --vc-blue-soft:#eef5ff;
  --vc-radius:16px;
  --vc-shadow:0 5px 22px rgba(16,24,40,.055);
}

/* Fondo y ancho: más sensación de plataforma, menos "página encajada" */
html,body{
  background:var(--vc-bg) !important;
  color:var(--vc-ink);
}
.wrap{
  max-width:1320px !important;
  padding:18px 24px 52px !important;
}

/* Barra superior más limpia */
.topbar{
  min-height:60px !important;
  padding-left:max(18px,calc((100vw - 1320px)/2 + 4px)) !important;
  padding-right:max(18px,calc((100vw - 1320px)/2 + 4px)) !important;
  background:rgba(255,255,255,.94) !important;
  box-shadow:0 1px 0 rgba(16,24,40,.07),0 4px 18px rgba(16,24,40,.035);
}
.top-spacer{
  height:calc(60px + env(safe-area-inset-top,0px)) !important;
}
.top-left{
  color:var(--vc-ink) !important;
  font-size:15px !important;
}
.top-left .mark{
  width:30px !important;
  height:30px !important;
  border-radius:9px !important;
}
.navpill{
  background:#f2f4f7 !important;
  padding:4px !important;
  max-width:620px !important;
  margin:auto !important;
}
.navpill button{
  min-height:34px !important;
  padding:7px 15px !important;
  font-size:12px !important;
}
.navpill button.on{
  background:#fff !important;
  box-shadow:0 1px 5px rgba(16,24,40,.10) !important;
}
.top-right .ghost{
  font-size:12px !important;
}

/* Cabecera de operación */
.hero.ops-hero{
  margin:8px 0 14px !important;
  padding:0 !important;
}
.hero.ops-hero .eye{
  font-size:11px !important;
  letter-spacing:.08em !important;
  color:var(--vc-blue) !important;
}
.hero.ops-hero h1{
  font-size:34px !important;
  line-height:1.08 !important;
  color:#111827 !important;
}
.hero.ops-hero p{
  max-width:780px !important;
  color:var(--vc-muted) !important;
}

/* Estado superior más parecido a un centro de control */
.ops-status{
  margin-bottom:18px !important;
  padding:11px 15px !important;
  border-radius:13px !important;
  background:#fff !important;
  border:1px solid var(--vc-border) !important;
  box-shadow:0 2px 10px rgba(16,24,40,.035) !important;
}
.ops-status .live{
  color:#344054 !important;
}

/* KPI: menos "tarjetas genéricas", más indicadores */
.ops-overline{
  margin:22px 0 11px !important;
}
.ops-overline h2{
  font-size:19px !important;
  color:#111827 !important;
}
.ops-overline p{
  font-size:12px !important;
  color:var(--vc-muted) !important;
}
.ops-kpis{
  gap:12px !important;
  margin-bottom:22px !important;
}
.ops-kpi{
  border:1px solid var(--vc-border) !important;
  border-radius:15px !important;
  box-shadow:var(--vc-shadow) !important;
  padding:15px 17px !important;
  background:#fff !important;
}
.ops-kpi .k-label{
  font-size:10.5px !important;
  letter-spacing:.055em !important;
}
.ops-kpi .k-value{
  font-size:25px !important;
  color:#182230;
}
.ops-kpi.state{
  position:relative;
  overflow:hidden;
}
.ops-kpi.state:before{
  content:"";
  position:absolute;
  left:0;top:0;bottom:0;width:4px;
  background:var(--green);
}
.ops-kpi.state.warn:before{background:var(--amber)}
.ops-kpi.state.crit:before{background:var(--red)}

/* Situación actual: MAPA GRANDE + contexto estrecho.
   Esta es la corrección principal del diseño anterior. */
.ops-grid{
  grid-template-columns:minmax(0,1.85fr) minmax(300px,.82fr) !important;
  gap:18px !important;
  align-items:stretch !important;
}
.ops-map-card{
  order:1 !important;
  border-radius:18px !important;
  border:1px solid var(--vc-border) !important;
  box-shadow:var(--vc-shadow) !important;
  background:#fff !important;
  overflow:hidden !important;
}
.ops-side{
  order:2 !important;
  border-radius:18px !important;
  border:1px solid var(--vc-border) !important;
  box-shadow:var(--vc-shadow) !important;
  background:#fff !important;
  max-height:min(540px,58vh) !important;
}
.ops-map-card .map.lg{
  height:min(540px,58vh) !important;
  min-height:430px !important;
}
.ops-map-card .map-wrap{
  background:#e8eef4;
}
.ops-map-card .map-alert-banner{
  left:14px !important;
  top:14px !important;
  right:auto !important;
  max-width:calc(100% - 28px) !important;
  border-radius:10px !important;
  box-shadow:0 3px 14px rgba(16,24,40,.14) !important;
}
.map-legend{
  padding:10px 14px !important;
  gap:7px 15px !important;
  font-size:11px !important;
}
.ops-map-card .metrics{
  display:flex !important;
  padding:10px 14px !important;
  background:#fff !important;
}
.ops-map-card .metric{
  min-width:90px !important;
}
.ops-map-card .metric .l{
  font-size:10px !important;
}
.ops-map-card .metric .v{
  font-size:18px !important;
}

/* Contexto: panel compacto, no protagonista */
.ops-side-head{
  padding:16px 17px 12px !important;
}
.ops-side-head h2{
  font-size:17px !important;
}
.ops-side-body{
  padding:8px 12px 12px !important;
}
.ops-sec-label{
  margin:9px 4px 5px !important;
  font-size:10px !important;
  letter-spacing:.06em !important;
}
.ops-side .item{
  padding:10px 9px !important;
  border-radius:10px !important;
}
.ops-side .item b{
  font-size:12.5px !important;
}
.ops-side .item small{
  font-size:11px !important;
}
.ops-side-foot{
  padding:10px 13px 13px !important;
}
.ops-side-foot .btn{
  min-height:38px !important;
}

/* Recomendación: convertirla en protagonista después del mapa */
.ops-results{
  margin-top:20px !important;
  border-radius:18px !important;
  border:1px solid var(--vc-border) !important;
  box-shadow:var(--vc-shadow) !important;
  background:#fff !important;
}
.ops-results .card-h{
  padding-bottom:3px;
}
.ops-results .card-h h2{
  font-size:20px !important;
  color:#111827 !important;
}
.action-card{
  border-radius:14px !important;
  border:1px solid var(--vc-border) !important;
  background:#fff !important;
  box-shadow:0 2px 10px rgba(16,24,40,.035) !important;
}
.action-card.prio1{
  box-shadow:inset 4px 0 0 var(--red),0 2px 10px rgba(16,24,40,.035) !important;
}
.action-card.prio2{
  box-shadow:inset 4px 0 0 var(--amber),0 2px 10px rgba(16,24,40,.035) !important;
}
.action-card.prio3{
  box-shadow:inset 4px 0 0 var(--vc-blue),0 2px 10px rgba(16,24,40,.035) !important;
}

/* CTA de decisión */
.decision-sticky-cta{
  border-radius:16px !important;
  background:#172033 !important;
  box-shadow:0 10px 30px rgba(16,24,40,.12) !important;
}
.decision-sticky-cta .btn{
  min-height:42px !important;
  border-radius:10px !important;
}

/* Tablas */
.alt-table-wrap{
  border-radius:14px !important;
  border-color:var(--vc-border) !important;
  box-shadow:0 2px 10px rgba(16,24,40,.025);
}
.alt-table th{
  background:#f8fafc !important;
}

/* Responsive */
@media(max-width:1050px){
  .top-left{font-size:13px !important}
  .top-right .ghost{padding:6px !important}
  .navpill button{padding:7px 10px !important}

<script>
const NET = (typeof OSM_NET!=='undefined'&&Array.isArray(OSM_NET))?OSM_NET:[];
const SHOCKS={
  obra:{name:'Obra OB-002 activa',desc:'Capacidad Centenario / Doble Calzada',on:true,feature:'obra_capacidad',weight:-0.31},
  semaforo:{name:'Descoordinación semafórica',desc:'Ciclos incompatibles en el centro',on:true,feature:'semaforo_desync',weight:0.19},
  evento:{name:'Demanda evento / turismo',desc:'Pico acceso norte',on:true,feature:'evento_demanda',weight:0.24}
};
const MEASURES={
  desvio:{name:'Desvío protegido Centenario–C19',desc:'Ruta prioritaria',on:false,feature:'desvio_protegido',weight:0.22},
  onda:{name:'Onda verde temporal',desc:'Tres ejes 16:30–19:00',on:false,feature:'onda_verde',weight:0.18},
  ventana:{name:'Ventana logística 10–15 h',desc:'Restringe pico',on:false,feature:'ventana_logistica',weight:0.12}
};
const STUDY=[[4.548,-75.658],[4.555,-75.648],[4.550,-75.638],[4.538,-75.632],[4.525,-75.638],[4.518,-75.652],[4.520,-75.678],[4.528,-75.698],[4.538,-75.702],[4.548,-75.688],[4.552,-75.672],[4.548,-75.658]];
const VC_ML_MODEL = {"features":["demanda","perdida_capacidad","incidente","evento","descoordinacion_semaforica","clima"],"means":[0.7008463380231886,0.1751818245262322,0.5009617922907892,0.5005119338520911,0.49842595038693827,0.5007431109712897],"scales":[0.28854912111939285,0.1010896560339955,0.2875181558208216,0.2891249192629716,0.2886393231240741,0.2898535783802252],"logit_coef":[0.8359774698783218,0.4101143249366909,0.5400409645012219,0.45121153122096574,0.3542691234796326,0.23730198766859426],"logit_intercept":2.407599340538208,"delay_means":[0.7008463380231886,0.1751818245262322,0.5009617922907892,0.5005119338520911,0.49842595038693827,0.5007431109712897],"delay_scales":[0.28854912111939285,0.1010896560339955,0.2875181558208216,0.2891249192629716,0.2886393231240741,0.2898535783802252],"delay_coef":[2.8745015653374257,3.5393440347066947,2.288200480786142,1.7274589211063733,1.4330568543048507,0.8595441663881136],"delay_intercept":28.646950372965915,"metrics":{"auc":0.791237025457282,"mae_min":0.9528458625733172,"train_n":30000,"seed":42}};
function mlScore(sh,me){
  // Modelo de ML entrenado fuera del navegador con 30.000 estados de desarrollo sintéticos.
  const x=[
    0.70 + (sh.evento?0.14:0) - (me.ventana?0.06:0),
    0.03 + (sh.obra?0.25:0) + (sh.semaforo?0.08:0) - (me.desvio?0.08:0),
    sh.obra?0.20:0.04,
    sh.evento?0.75:0.15,
    sh.semaforo?0.78:0.18,
    0.15
  ].map(v=>Math.max(0,Math.min(1.2,v)));
  const z=x.map((v,i)=>(v-VC_ML_MODEL.means[i])/VC_ML_MODEL.scales[i]);
  const logit=VC_ML_MODEL.logit_intercept+z.reduce((a,v,i)=>a+v*VC_ML_MODEL.logit_coef[i],0);
  const prob=1/(1+Math.exp(-logit));
  const zd=x.map((v,i)=>(v-VC_ML_MODEL.delay_means[i])/VC_ML_MODEL.delay_scales[i]);
  const delay=VC_ML_MODEL.delay_intercept+zd.reduce((a,v,i)=>a+v*VC_ML_MODEL.delay_coef[i],0);
  return {prob:Math.max(0,Math.min(.999,prob)),delay:Math.max(0,delay),features:x};
}
function mlScenario(sh,me){return mlScore(sh,me)}

const LABELS=[{t:'Av. Centenario',p:[4.536,-75.660]},{t:'Carrera 19',p:[4.525,-75.682]},{t:'Av. Las Américas',p:[4.542,-75.690]},{t:'Av. 19 de Enero',p:[4.555,-75.655]},{t:'Carrera 14',p:[4.548,-75.665]},{t:'Doble Calzada',p:[4.522,-75.710]}];

function hash(s){const x=Math.sin(s*12.9898)*43758.5453;return x-Math.floor(x)}
function nameHit(n,ks){if(!n)return false;const t=n.toLowerCase();return ks.some(k=>t.includes(k))}
const KO=['centenario','doble calzada','montenegro','las américas','las americas'];
const KS=['carrera 14','carrera 19','carrera 18','calle 21','bolívar','bolivar'];
const KE=['19 norte','centenario','19 de enero','norte'];
const KD=['centenario','carrera 19','carrera 14'];
const KN=['carrera 19','carrera 14','bolívar','bolivar','carrera 18'];

function loadsWith(sh,me){
  // Modelo de estrés aditivo y acotado por tramo (reemplaza la cadena de multiplicadores
  // anterior, que podía desbordar 3x-4x antes del clamp final y producir resultados
  // incoherentes: medidas que no cambiaban nada visible, o escenarios distintos con el
  // mismo resultado porque todo terminaba topado en el mismo techo).
  return NET.map((link,i)=>{
    // Base: vías primarias un poco más cargadas; secundarias más libres (mapa legible)
    let base=0.28+0.18*hash((link.n||'').length*13+i*29+link.c*7);
    if(link.c===0) base+=0.08;

    // Estrés por shock (más fuerte en corredores nombrados para que el mapa se lea en demo)
    let stress=0;
    if(sh.obra&&nameHit(link.n,KO)) stress+=0.48;
    if(sh.semaforo&&nameHit(link.n,KS)) stress+=0.32;
    if(sh.evento&&nameHit(link.n,KE)) stress+=0.26;
    const mid=link.g[Math.floor(link.g.length/2)];
    if(mid&&(sh.obra||sh.semaforo||sh.evento)){
      const d=Math.hypot(mid[0]-4.536,mid[1]+75.672);
      if(d<0.028) stress+=0.14;
      if(d<0.016) stress+=0.12;
      if(d<0.010) stress+=0.10;
    }

    let relief=0;
    if(me.desvio&&nameHit(link.n,KD)) relief+=0.36;
    if(me.onda&&nameHit(link.n,KN)) relief+=0.24;
    if(me.ventana) relief+=0.10;

    let spill=0;
    if(me.desvio&&nameHit(link.n,['carrera 18','calle 21','bolívar','bolivar'])) spill+=0.12;

    const netStress=Math.max(0,Math.min(1.15,stress-relief+spill));
    const vc=base+netStress*1.12;
    return +Math.min(1.55,Math.max(0.15,vc)).toFixed(3);
  });
}
function curLoads(){return loadsWith(
  {obra:SHOCKS.obra.on,semaforo:SHOCKS.semaforo.on,evento:SHOCKS.evento.on},
  {desvio:MEASURES.desvio.on,onda:MEASURES.onda.on,ventana:MEASURES.ventana.on}
)}
function metrics(L){
  if(!L.length)return{p95:0,max:0,viaje:0,demora:0};
  const s=[...L].sort((a,b)=>a-b);
  const p95=s[Math.min(s.length-1,Math.ceil(.95*s.length)-1)];
  const max=Math.max(...L), avg=L.reduce((a,b)=>a+b,0)/L.length;
  const viaje=+(5.5+avg*2.8).toFixed(1);
  return{p95:+p95.toFixed(2),max:+max.toFixed(2),viaje,demora:+Math.max(0,viaje-5.4).toFixed(1)};
}
// Paleta operacional oficial (documento de alcance, sección 9). Umbrales iniciales, calibrables.
const PALETTE={
  // Esquemático: bandas bien separadas sobre fondo claro (red OSM real, estilo diagrama)
  vcVerde:'#22C55E', vcAmarillo:'#EAB308', vcNaranja:'#F97316', vcRojo:'#EF4444', vcRojoOscuro:'#B91C1C',
  sinDato:'#CBD5E1', obraActiva:'#7C3AED', obraPropuesta:'#C4B5FD', cierre:'#1F2937',
  desvioRecomendado:'#0D9488', desvioAlterna:'#14B8A6', desvioComplementaria:'#2DD4BF',
  emergencia:'#0F766E', descartada:'#94A3B8'
};
function colorVc(vc){
  if(vc>1.15)return PALETTE.vcRojoOscuro;
  if(vc>=1.00)return PALETTE.vcRojo;
  if(vc>=0.85)return PALETTE.vcNaranja;
  if(vc>=0.70)return PALETTE.vcAmarillo;
  return PALETTE.vcVerde;
}
function vcLabel(vc){
  if(vc>1.15)return 'Crítico';
  if(vc>=1.00)return 'Saturación';
  if(vc>=0.85)return 'Carga alta';
  if(vc>=0.70)return 'Carga moderada';
  return 'Normal';
}
function inside(ll){
  const x=ll[1],y=ll[0];let ins=false;
  for(let i=0,j=STUDY.length-1;i<STUDY.length;j=i++){
    const yi=STUDY[i][0],xi=STUDY[i][1],yj=STUDY[j][0],xj=STUDY[j][1];
    if(((yi>y)!==(yj>y))&&(x<(xj-xi)*(y-yi)/((yj-yi)||1e-12)+xi))ins=!ins;
  }
  return ins;
}
function feats(){const f=[];Object.values(SHOCKS).forEach(s=>{if(s.on)f.push({n:s.feature,v:s.weight,type:'shock'})});Object.values(MEASURES).forEach(m=>{if(m.on)f.push({n:m.feature,v:m.weight,type:'measure'})});return f}
function conf(){return Math.min(92,Math.max(55,70+Object.values(SHOCKS).filter(s=>s.on).length*4+Object.values(MEASURES).filter(m=>m.on).length*3-8))}

let view='ops', lastRun=null, decision=null, decisionReason='', decisionAltId=null, decisionAt=null, decisionSnapshot=null;

function paintMap(el,loads,opt={}){
  if(!el)return;
  if(typeof L==='undefined' || !L || !L.map){
    el.innerHTML='<div style="display:flex;align-items:center;justify-content:center;height:100%;min-height:120px;font-size:12px;color:var(--muted);padding:12px;text-align:center;line-height:1.45">Mapa no disponible: Leaflet no cargó (CDN bloqueado o sin red).<br><span style="font-size:11px">El resto de Simular sigue operativo. La red OSM sigue en el motor.</span></div>';
    return;
  }
  try{
    _paintMapImpl(el,loads,opt);
  }catch(err){
    console.warn('paintMap: no se pudo dibujar el mapa (se continúa con el resto de la interfaz).',err);
    el.innerHTML='<div style="display:flex;align-items:center;justify-content:center;height:100%;font-size:12px;color:var(--muted);padding:12px;text-align:center">Mapa no disponible temporalmente</div>';
  }
}
function _paintMapImpl(el,loads,opt={}){
  if(el._map){el._map.remove();el._map=null}
  const map=L.map(el,{center:[4.536,-75.668],zoom:13,zoomControl:!!opt.ctrl,attributionControl:false,preferCanvas:true,
    dragging:!!opt.ix,scrollWheelZoom:!!opt.ix,doubleClickZoom:!!opt.ix});
  // Mapa base real de Armenia (Carto/OSM): calles, barrios y contexto urbano visibles
  el.style.background='#e8eef4';
  const mapPane=map.getContainer();
  if(mapPane) mapPane.style.background='#e8eef4';
  L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',{
    subdomains:'abcd', maxZoom:19, opacity:0.95,
    attribution:'© OpenStreetMap · © CARTO'
  }).addTo(map);
  const ly=L.layerGroup().addTo(map);
  const Lds=loads||curLoads();
  // Red limpia tipo diagrama: solo vías con nombre + primarias; sin callejones cortos
  function linkLen(g){
    let s=0;
    for(let i=1;i<g.length;i++){
      const a=g[i-1],b=g[i];
      s+=Math.hypot((b[0]-a[0])*111, (b[1]-a[1])*111*Math.cos(a[0]*Math.PI/180));
    }
    return s; // ~km
  }
  const IMPORTANT=['centenario','carrera 14','carrera 19','carrera 18','calle 21','las américas','las americas','19 de enero','doble calzada','bolívar','bolivar','montenegro','ancizar','occidente','norte'];
  function isSpine(link){
    if(!link.g||link.g.length<2)return false;
    const n=(link.n||'').toLowerCase().trim();
    if(link.c===0 && n.length>2) return true; // arteria primaria con nombre
    if(n && IMPORTANT.some(k=>n.includes(k))) return true;
    if(link.c===0 && linkLen(link.g)>=0.12) return true; // primaria larga aunque sin nombre
    return false;
  }
  const drawnPts=[];
  const compact=!!opt.compact;
  // Esqueleto gris solo de la “espina” vial (evita el nido de tramos OSM)
  NET.forEach(link=>{
    if(!isSpine(link))return;
    L.polyline(link.g,{
      color:'#E2E8F0', weight:link.c===0?(compact?2.6:2.2):(compact?1.6:1.4), opacity:1,
      interactive:false, lineCap:'round', lineJoin:'round'
    }).addTo(ly);
    link.g.forEach(p=>drawnPts.push(p));
  });
  // Carga v/c sobre la misma espina; secundarias solo si están saturadas
  const ranked=NET.map((link,i)=>({link,i,vc:Lds[i]||0}))
    .filter(({link,vc})=>{
      if(!link.g||link.g.length<2)return false;
      if(isSpine(link)) return true;
      if(compact) return false; // mini-mapas: solo espina
      return vc>=0.85 && linkLen(link.g)>=0.08;
    })
    .sort((a,b)=>a.vc-b.vc);
  ranked.forEach(({link,vc})=>{
    const col=colorVc(vc);
    let w=compact?2.8:2.4;
    if(link.c===0) w=compact?5.0:4.4;
    if(vc>=0.70) w+=1.0;
    if(vc>=0.85) w+=1.5;
    if(vc>=1.00) w+=2.0;
    if(vc>=1.15) w+=1.4;
    // Contorno suave para que el color se lea sobre el mapa real de la ciudad
    if(!compact){
      L.polyline(link.g,{
        color:'#ffffff', weight:w+2.2, opacity:0.85,
        lineCap:'round', lineJoin:'round', interactive:false
      }).addTo(ly);
    }
    L.polyline(link.g,{
      color:col, weight:w, opacity:0.95,
      lineCap:'round', lineJoin:'round'
    }).addTo(ly);
    link.g.forEach(p=>drawnPts.push(p));
  });

    if(opt.labels){
    const labelPane = map.createPane('labels');
    labelPane.style.zIndex = 700;
    const labCls = compact ? 'map-label map-label-sm' : 'map-label';
    LABELS.forEach(({t,p})=>{
      L.marker(p,{interactive:false,pane:'labels',icon:L.divIcon({
        className:'vc-map-label',
        html:`<div class="${labCls}">${t}</div>`,
        iconSize:[0,0],
        iconAnchor:[compact?28:40, compact?8:12]
      })}).addTo(ly);
    });
  }
  if(opt.obra&&!opt.compact&&SHOCKS.obra.on)L.circleMarker([4.536,-75.668],{radius:6,color:'#1d1d1f',weight:2,fillColor:'#1d1d1f',fillOpacity:1}).addTo(ly);
  // What-if / highlight geográfico desde contexto
  const hk=opt.highlight||opsHighlight;
  if(hk&&CONTEXT_GEO[hk]){
    const g=CONTEXT_GEO[hk];
    const keys=g.keys||[];
    NET.forEach((link,i)=>{
      if(!keys.length)return;
      const n=(link.n||'').toLowerCase();
      if(!keys.some(k=>n.includes(k)))return;
      L.polyline(link.g,{color:'#0D9488',weight:link.c===0?6:4.2,opacity:.92,lineCap:'round',lineJoin:'round'}).addTo(ly);
    });
    L.circleMarker(g.center,{radius:11,color:'#0F766E',weight:2.5,fillColor:'#14B8A6',fillOpacity:.2}).addTo(ly);
    L.marker(g.center,{interactive:false,zIndexOffset:800,icon:L.divIcon({
      className:'vc-map-label',
      html:`<div class="map-label" style="border-color:rgba(0,113,227,.35);box-shadow:0 0 0 2px rgba(0,113,227,.15)">${g.label}</div>`,
      iconSize:[0,0],iconAnchor:[50,28]
    })}).addTo(ly);
    if(opt.ix) setTimeout(()=>{try{map.flyTo(g.center,g.zoom||15,{duration:.6})}catch(e){}},40);
  }
  // Encuadre solo sobre lo dibujado (no toda la ciudad OSM)
  const pts=drawnPts.length?drawnPts:NET.flatMap(x=>x.g||[]);
  if(pts.length){
    const pad=compact?10:18;
    const maxZ=compact?14:13;
    map.fitBounds(L.latLngBounds(pts),{padding:[pad,pad],maxZoom:maxZ});
  }
  el._map=map;
  setTimeout(()=>{try{map.invalidateSize();}catch(e){}}, compact?120:60);
  if(compact) setTimeout(()=>{try{map.invalidateSize();}catch(e){}}, 320);
}

// La función scenarios() (4 escenarios: Estado actual / Sin intervención / Medidas propuestas /
// Alternativa) se eliminó por completo. Toda la funcionalidad de comparación vive ahora en
// buildAlternatives(): 3 alternativas de desvío con sus propias métricas de motor.


// ================= ALTERNATIVAS DE DESVÍO (sección 4 del documento de alcance) =================
// Caso base: OB-002 reduce capacidad en Av. Centenario / Doble Calzada.
// Las cifras de tránsito (v/c, viaje, demora) vienen del mismo motor heurístico que el resto de la demo
// (loadsWith / metrics) y comparten sus límites. Los campos cualitativos (barrios, comercio, seguridad)
// son una síntesis editorial para esta demostración: no provienen de un inventario social ni de tránsito oficial.
function corridorVc(L,roadNames){
  // p85 del corredor específico (no el máximo de un solo tramo, ni el máximo de toda la red):
  // más representativo del estado general de la ruta que un único punto extremo.
  const vals=[];
  NET.forEach((link,i)=>{
    const n=(link.n||'').toLowerCase();
    if(roadNames.some(rn=>n.includes(rn.toLowerCase()))) vals.push(L[i]);
  });
  if(!vals.length) return 0;
  vals.sort((a,b)=>a-b);
  const idx=Math.min(vals.length-1, Math.ceil(0.85*vals.length)-1);
  return +vals[idx].toFixed(2);
}

      restricciones:{ambulancia:true, viaApta:true, saturacionAlterna:A_vcCorr<1.15, seguridad:true, emergenciaSimultanea:true}
    },
    {
      id:'ALT-B', tag:'alternativa', title:'Cierre por fases, gestión manual, ventana logística',
      L:B_L, m:B_m, ml:B_ml,
      ruta:'Av. Centenario (tramo OB-002, cierre parcial alternado por fases) sin corredor de desvío protegido',

      razon:'Se activa como respaldo cuando el desvío protegido no puede operar (falla de coordinación semafórica, incidente) o mientras se habilita.',
      restricciones:{ambulancia:true, viaApta:true, saturacionAlterna:C_vcCorr<1.15, seguridad:true, emergenciaSimultanea:true}
    }

  ];
  // Rol por movilidad (v/c corredor). NO es la unica verdad: Multicriterio e ML pueden diferir.
  const ok=list.filter(a=>Object.values(a.restricciones).every(Boolean));
  const pool=ok.length?ok:list;
  pool.forEach(a=>{ a.tag='alternativa'; a.roles={movilidad:false,integral:false}; });
  list.forEach(a=>{ if(!a.roles) a.roles={movilidad:false,integral:false}; });
  const bestMov=[...pool].sort((a,b)=>a.vcMax-b.vcMax||a.m.p95-b.m.p95)[0];
  if(bestMov){ bestMov.tag='movilidad'; bestMov.roles.movilidad=true; }
  const rest=pool.filter(a=>a!==bestMov).sort((a,b)=>a.vcMax-b.vcMax);
  if(rest[0]) rest[0].tag='alternativa';
  if(rest[1]) rest[1].tag='contingencia';
  list.forEach(a=>{ if(!pool.includes(a)) a.tag='alternativa'; });
  return list;
}

function pickBestMobility(alts){
  const pool=(alts||[]).filter(a=>typeof passesHard==='function'?passesHard(a):Object.values(a.restricciones||{}).every(Boolean));
  const src=pool.length?pool:(alts||[]);
  if(!src.length) return null;
  return [...src].sort((a,b)=>a.vcMax-b.vcMax||a.m.p95-b.m.p95)[0];
}
function pickBestDelay(alts){
  const src=alts||[];
  if(!src.length) return null;
  return [...src].sort((a,b)=>(a.ml&&a.ml.delay!=null?a.ml.delay:9e9)-(b.ml&&b.ml.delay!=null?b.ml.delay:9e9))[0];
}

function hardFails(alt){
  if(!alt||!alt.restricciones) return [];
  return Object.entries(alt.restricciones).filter(([,v])=>!v).map(([k])=>k);
}
function passesHard(alt){ return hardFails(alt).length===0; }

function buildLastRun(R){
  const sh={obra:SHOCKS.obra.on,semaforo:SHOCKS.semaforo.on,evento:SHOCKS.evento.on};
  const baseline=metrics(loadsWith(sh,{desvio:false,onda:false,ventana:false}));
  const alts=buildAlternatives();
  const bestMov=pickBestMobility(alts)||alts[0];
  const ranked=[...alts].sort((a,b)=>a.ml.delay-b.ml.delay);
  const bestDelay=ranked[0];
  const c=conf();
  return {
    off:baseline,on:bestMov.m,feats:feats(),conf:c,
    bestMobilityId:bestMov.id,
    bestDelayId:bestDelay?bestDelay.id:null,
    ml:{current:R.ml,best:bestDelay?bestDelay.ml:null,ranking:ranked.map(x=>({id:x.id,title:x.title,delay:+x.ml.delay.toFixed(1),prob:+x.ml.prob.toFixed(3)})),auc:VC_ML_MODEL.metrics.auc,mae:VC_ML_MODEL.metrics.mae_min},
    recs:R.recs,cams:R.cams,obras:R.obras
  };
}

function actionKey(a){if(!a)return '';if(a.id)return String(a.id);return (a.title)?String(a.title).trim().toLowerCase():''}

function explainAction(a,R){
  const m=R&&R.m?R.m:{p95:0,viaje:0,demora:0};
  const risk=R&&R.ml?Math.round(R.ml.prob*100):0;
  const p95=m.p95||0;
  const viaje=m.viaje||0;
  const base=[
    `Prioridad #${a.prio||'—'} según impacto operativo estimado.`,
    `Estado de red: p95 v/c ${p95}, viaje medio ${viaje} min, riesgo IA ${risk}%.`
  ];
  if(a.act==='close'){
    return base.concat([
      'Se prioriza restringir el tramo porque concentra pérdida de capacidad (obra/incidente).',
      'Impacto esperado: bajar carga en el corredor crítico y proteger acceso local.',
      'Alternativa descartada: mantener abierto elevaría el p95 por encima del umbral de tensión.'
    ]).join(' ');
  }
  if(a.act==='open'){
    return base.concat([
      'Se recomienda activar esta medida porque libera capacidad en hora pico o corrige descoordinación.',
      'Impacto esperado: reducción de demora en ejes prioritarios sin cerrar la red completa.',
      'Se eligió frente a no intervenir porque el beneficio estimado supera el costo operativo.'
    ]).join(' ');
  }
  if(a.act==='route'){
    return base.concat([
      'El desvío/ruta se prioriza para redistribuir demanda fuera del tramo saturado.',
      'Impacto esperado: aliviar v/c en el corredor de conflicto y usar alternas con menor carga.',
      'Supera a otras opciones porque actúa de inmediato sobre el flujo, no solo sobre la programación de obras.'
    ]).join(' ');
  }
  if(a.act==='obra'){
    return base.concat([
      'La secuencia de obra evita solapes de cuadrilla y de corredor alterno.',
      'Impacto esperado: menos conflictos de red en la ventana crítica y mejor predictibilidad del PMT.',
      'Se prioriza porque un solape elevaría congestión en el alterno principal.'
    ]).join(' ');
  }
  return base.concat(['Recomendación generada por el motor operativo a partir de cámaras/sensores demo y estado de la red.']).join(' ');
}

function pushHistory(a,status){
  const now=new Date();
  const hh=String(now.getHours()).padStart(2,'0');
  const mm=String(now.getMinutes()).padStart(2,'0');
  const ss=String(now.getSeconds()).padStart(2,'0');
  const id='h'+now.getTime().toString(36)+Math.floor(Math.random()*1e3).toString(36);
  opsHistory.unshift({
    id,
    title:a.title||'Acción',
    detail:a.detail||'',
    act:a.act||'',
    status, // aplicada | descartada
    time:hh+':'+mm+':'+ss,
    at:now.toISOString(),
    measuresSnap:{desvio:MEASURES.desvio.on,onda:MEASURES.onda.on,ventana:MEASURES.ventana.on}
  });
  if(opsHistory.length>40) opsHistory.length=40;
  const k=actionKey(a);
  if(k) opsHandled.add(k);
  return id;
}

function revertHistory(id){
  const idx=opsHistory.findIndex(h=>h.id===id);
  if(idx<0)return;
  const h=opsHistory[idx];
  const k=actionKey(h);
  // volver a pendientes
  opsHandled.delete(k);
  if(lastRec){
    const exists=(lastRec.recs||[]).some(r=>actionKey(r)===k);
    if(!exists){
      lastRec.recs=(lastRec.recs||[]);
      lastRec.recs.unshift({title:h.title,detail:h.detail,act:h.act});
    }
    if(lastRun) lastRun.recs=lastRec.recs;
  }
  // si estaba aplicada, deshacer medidas típicas asociadas (demo)
  if(h.status==='aplicada'){
    const t=(h.title||'').toLowerCase();
    if(h.act==='route'||t.includes('desvío')) MEASURES.desvio.on=false;
    if(t.includes('onda verde')) MEASURES.onda.on=false;
    if(t.includes('ventana')) MEASURES.ventana.on=false;
  }
  opsHistory.splice(idx,1);
  toast('Acción revertida · vuelve a pendientes');
  runSim({silent:true});
}

function topActions(R){
  // Solo las mejores acciones pendientes (máx 3), sin las ya aplicadas/descartadas
  const list=((R&&R.recs)?R.recs.slice():[]).filter(r=>!opsHandled.has(actionKey(r)));
  const order={close:0,obra:1,route:2,open:3};
  list.sort((a,b)=>(order[a.act]??9)-(order[b.act]??9));
  return list.slice(0,3).map((r,i)=>({...r,prio:i+1,why:explainAction({...r,prio:i+1},R)}));
}

function riskLevel(R){
  if(!R)return 'ok';
  const p=R.ml?R.ml.prob:0;
  const p95=R.m?R.m.p95:0;
  const max=R.m?R.m.max:0;
  // Prioriza métricas de red visibles en el mapa
  if(p95>=1.00||max>=1.20||p>=0.78)return 'crit';
  if(p95>=0.85||max>=1.00||p>=0.55)return 'warn';
  return 'ok';
}

function runSim(opts={}){
  // Análisis en segundo plano (proactivo). silent=true no muestra loaders.
  const silent=!!opts.silent;
  if(runSim._busy)return;
  runSim._busy=true;
  const btn=document.getElementById('btn-run');
  const mapEl=document.getElementById('map-ops');
  if(!silent && btn){
    btn.disabled=true;
    btn.classList.add('btn-loading');
    btn.innerHTML='<span class="spin"></span> Actualizando…';
  }
  let overlay=document.getElementById('map-loading');
  if(!silent && mapEl){
    const wrap=mapEl.parentElement;
    if(wrap && !wrap.classList.contains('map-wrap')) wrap.classList.add('map-wrap');
    if(!overlay){
      overlay=document.createElement('div');
      overlay.id='map-loading';
      overlay.className='map-loading';
      overlay.innerHTML='<div class="spin-lg"></div><p>IA actualizando recomendaciones…</p>';
      (wrap||mapEl).appendChild(overlay);
    } else overlay.style.display='flex';
  }
  const delay=silent?180:700;
  setTimeout(()=>{
    try{
      const R=recognize();
      lastRec=R;
      lastRun=buildLastRun(R);
      lastSyncAt=Date.now();
      openSheet(false);
      if(view==='ops') render();
      else if(!silent){
        // Si no estamos en ops, restaurar botón por si quedó en loading
        const b=document.getElementById('btn-run');
        if(b){ b.disabled=false; b.classList.remove('btn-loading'); b.textContent='Actualizar ahora'; }
      }
      if(!silent) toast('Recomendaciones actualizadas');
    } catch(err){
      console.error('runSim',err);
      toast('Error al actualizar simulación','warn');
    } finally {
      runSim._busy=false;
    }
  }, delay);
}

function applyAction(idx){
  const acts=topActions(lastRec||{});
  const a=acts[idx];
  if(!a)return;
  // Activar medida por campo explícito (no por substring del título)
  const measure=a.measure||({
    route:'desvio',
    desvio:'desvio',
    onda:'onda',
    ventana:'ventana'
  }[a.act]);
  if(measure && MEASURES[measure]) MEASURES[measure].on=true;
  // Heurística de respaldo solo si el título nombra la medida conocida
  const t=(a.title||'').toLowerCase();
  if(!measure){
    if(t.includes('desvío')||t.includes('desvio')) MEASURES.desvio.on=true;
    if(t.includes('onda')) MEASURES.onda.on=true;
    if(t.includes('ventana')) MEASURES.ventana.on=true;
  }
  pushHistory(a,'aplicada');
  if(lastRec&&lastRec.recs){
    lastRec.recs=lastRec.recs.filter(r=>actionKey(r)!==actionKey(a));
    if(lastRun) lastRun.recs=lastRec.recs;
  }
  toast('Acción aplicada · registrada en historial');
  runSim({silent:true});
}


let opsMonitor=null;
function startOpsMonitor(){
  if(opsMonitor)return;
  opsMonitor=setInterval(()=>{
    if(view!=='ops')return;
    if(runSim._busy)return;
    // No re-render completo si el usuario escribe la justificación o tiene foco en el formulario de decisión
    const ae=document.activeElement;
    if(ae && (ae.id==='dr' || ae.closest && ae.closest('#decision-card'))){
      lastSyncAt=Date.now(); // solo avanza el reloj visual
      return;
    }
    runSim({silent:true});
  }, 45000);
}
function stopOpsMonitor(){
  if(opsMonitor){clearInterval(opsMonitor);opsMonitor=null}
}

function dismissAction(idx){
  const acts=topActions(lastRec||{});
  const a=acts[idx];
  if(!a)return;
  pushHistory(a,'descartada');
  if(lastRec&&lastRec.recs){
    lastRec.recs=lastRec.recs.filter(r=>actionKey(r)!==actionKey(a));
    if(lastRun) lastRun.recs=lastRec.recs;
  }
  render();
  toast('Recomendación descartada · registrada en historial');
}

function render(){
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===view));
  const root=document.getElementById('view');
  root.querySelectorAll('.map').forEach(el=>{if(el._map){el._map.remove();el._map=null}});
  if(view==='ops') renderOps(root);
  else if(view==='exp') renderExp(root);
  else if(view==='port') renderPort(root);
  else if(view==='multi') renderMulti(root);
  else if(view==='datos') renderDatos(root);
}

  (function startLive(){
    const ago=document.getElementById('ops-ago');
    const ring=document.getElementById('ops-ring');
    if(!ago||!ring)return;
    if(renderOps._liveTimer) clearInterval(renderOps._liveTimer);
    const CYCLE=45; // segundos del monitor 24/7
    function tick(){
      const sec=Math.max(0,Math.floor((Date.now()-lastSyncAt)/1000));
      ago.textContent = sec<60 ? ('Actualizado hace '+sec+'s') : ('Actualizado hace '+Math.floor(sec/60)+'m');
      const p=((sec%CYCLE)/CYCLE)*100;
      ring.style.setProperty('--p', p.toFixed(1));
    }
    tick();
    renderOps._liveTimer=setInterval(tick,1000);
  })();
}

// ================= PORTAFOLIO DE OBRAS (fuente única, usada por Obras y por el Calendario) =================
const CAL_START = new Date(2026,8,1); // 1 sep 2026
const CAL_DAYS = 90; // horizonte de 90 días (1 sep – 29 nov 2026)
const OBRAS_PORTFOLIO=[
  {id:'OB-001', name:'Rehabilitación por fases 19 de Julio', corridor:'Av. de las Américas', crew:'Cuadrilla A', start:'2026-09-05', end:'2026-09-24', status:'programada'},
  {id:'OB-002', name:'Rehabilitación Doble Calzada Armenia-Montenegro', corridor:'Av. Centenario', crew:'Cuadrilla B', start:'2026-09-13', end:'2026-10-28', status:'ejecucion'},
  {id:'OB-003', name:'Modernización semafórica centro', corridor:'Carrera 19 / Centro', crew:'Cuadrilla A', start:'2026-09-21', end:'2026-10-11', status:'programada'},
  {id:'OB-004', name:'Drenaje preventivo Centenario', corridor:'Av. Centenario', crew:'Cuadrilla C', start:'2026-09-08', end:'2026-09-18', status:'programada'},
  {id:'OB-005', name:'Reposición de red Calle 21', corridor:'Calle 21', crew:'Cuadrilla A', start:'2026-10-05', end:'2026-10-27', status:'programada'},
  {id:'OB-006', name:'Mantenimiento nocturno Av. 19 de Enero', corridor:'Av. 19 de Enero', crew:'Cuadrilla B', start:'2026-10-15', end:'2026-11-04', status:'programada'}
];
// Propuestas de reprogramación hechas en esta sesión (no oficiales). Todo lo demás en Obras y
// Calendario se recalcula a partir de esto, para que un cambio aquí se vea en cascada en todas partes.
let OBRAS_OVERRIDE={};
let lastMovedObraId=null;
let lastCalChangeMsg='';
function effectivePortfolio(){
  return OBRAS_PORTFOLIO.map(o=>{
    const ov=OBRAS_OVERRIDE[o.id];
    if(!ov) return o;
    return {...o, start:ov.start, end:ov.end, proposed:true};
  });
}
function dayOffset(dateStr){ return Math.round((new Date(dateStr) - CAL_START) / 86400000); }
function obraActiveOnDay(o, dayIdx){ return dayIdx >= dayOffset(o.start) && dayIdx <= dayOffset(o.end); }
function obrasActiveOnDay(dayIdx){ return effectivePortfolio().filter(o=>obraActiveOnDay(o,dayIdx)); }
// Conflictos reales: se calculan comparando fechas efectivas (con propuestas aplicadas) de cada
// par de obras que comparten corredor o cuadrilla. Cambiar una fecha en "Proponer reprogramación"
// recalcula esta lista de inmediato.
function computeConflicts(){
  const list=effectivePortfolio();
  const out=[];
  for(let i=0;i<list.length;i++){
    for(let j=i+1;j<list.length;j++){
      const a=list[i], b=list[j];
      const sameCorridor=a.corridor===b.corridor;
      const sameCrew=a.crew===b.crew;
      if(!sameCorridor && !sameCrew) continue;
      const aS=dayOffset(a.start), aE=dayOffset(a.end), bS=dayOffset(b.start), bE=dayOffset(b.end);
      const overlap=Math.min(aE,bE)-Math.max(aS,bS)+1;
      let severity=null, desc='';
      if(sameCorridor && overlap>0){
        severity='crit';
        desc=`Ambas obras están activas a la vez en ${a.corridor} (se superponen ${overlap} día${overlap===1?'':'s'}). Riesgo real de saturar el corredor alterno.`;
      } else if(sameCrew && overlap>0){
        severity='high';
        desc=`Comparten ${a.crew} y sus fechas se superponen ${overlap} día${overlap===1?'':'s'}: obliga a turnos dobles o retrasa un frente.`;
      } else if(sameCorridor && overlap>-6 && overlap<=0){
        severity='pend';
        desc=`Comparten ${a.corridor} y quedan a ${Math.abs(overlap)} día${Math.abs(overlap)===1?'':'s'} de distancia; poco margen si alguna se atrasa.`;
      } else {
        continue;
      }
      out.push({a:a.id,b:b.id,severity,desc,resolved:false});
    }
  }
  return out.sort((x,y)=>({crit:0,high:1,pend:2}[x.severity]-{crit:0,high:1,pend:2}[y.severity]));
}

function avgRiskScore(){
  let s=0; for(let i=0;i<CAL_DAYS;i++) s+=dailyRisk(i);
  return +(s/CAL_DAYS).toFixed(1);
}
function countRiskDays(){
  let crit=0, high=0;
  for(let i=0;i<CAL_DAYS;i++){
    const r=dailyRisk(i);
    if(r>72) crit++;
    else if(r>45) high++;
  }
  return {crit, high};
}
// Riesgo diario real: nº de obras simultáneas que comparten corredor o zona ese día (no es un valor decorativo).
function dailyRisk(dayIdx){
  const active = obrasActiveOnDay(dayIdx);
  const date = new Date(CAL_START); date.setDate(date.getDate()+dayIdx);
  const isWeekend = date.getDay()===0 || date.getDay()===6;
  let risk = active.length * 22; // cada obra simultánea suma presión
  const corridors = {};
  active.forEach(o=>{ corridors[o.corridor]=(corridors[o.corridor]||0)+1; });
  Object.values(corridors).forEach(n=>{ if(n>1) risk += 25; }); // mismo corredor = riesgo extra real
  if(isWeekend) risk -= 10; // menos tráfico de fondo el fin de semana
  return Math.max(4, Math.min(96, risk));
}

function renderMulti(root){
  const alts=buildAlternatives();
  if(!window._critWeights) window._critWeights={mov:30,eme:20,tp:15,com:15,seg:10,amb:10};
  const W=window._critWeights;
  const crit=[
    {k:'mov',label:'Movilidad y capacidad de red',desc:'Tiempos, saturación, colas, propagación',src:'motor',color:'#2563EB'},
    {k:'eme',label:'Emergencias y servicios esenciales',desc:'Acceso confiable a salud, bomberos y equipamientos críticos',src:'regla',color:'#DC2626'},
    {k:'tp',label:'Transporte público y movilidad activa',desc:'Buses, paraderos, peatones, bicicletas',src:'regla',color:'#7C3AED'},
    {k:'com',label:'Comercio, abastecimiento y empleo',desc:'Ventas, entregas, logística',src:'regla',color:'#D97706'},
    {k:'seg',label:'Seguridad vial',desc:'Riesgo para todos los modos',src:'regla',color:'#0F766E'},
    {k:'amb',label:'Impacto comunitario y ambiental',desc:'Barrios, ruido, emisiones, entorno',src:'regla',color:'#16A34A'}
  ];
  const srcLabel={motor:'Motor',regla:'Regla demo'};
  function scoreAlt(a,k){
    if(k==='mov') return Math.round(Math.max(0,Math.min(100,(1.3-a.m.p95)/0.9*100)));
    if(k==='eme') return a.restricciones.ambulancia&&a.restricciones.emergenciaSimultanea?(a.tag==='alternativa'?55:90):20;
    if(k==='tp') return a.tag==='movilidad'?78:a.tag==='contingencia'?66:48;
    if(k==='com') return a.comercio.startsWith('Impacto bajo')?82:a.comercio.startsWith('Impacto medio')?55:40;
    if(k==='seg') return a.restricciones.seguridad?(a.tag==='alternativa'?58:84):30;
    if(k==='amb') return a.barriosPerjudicados.length===0?80:a.barriosPerjudicados.length===1?60:40;
    return 50;
  }
  const totalW=Object.values(W).reduce((x,y)=>x+y,0)||1;
  const results=alts.map(a=>{
    const scores=crit.map(c=>{
      const score=scoreAlt(a,c.k);
      const w=W[c.k]||0;
      const contrib=+(score*(w/totalW)).toFixed(1);
      return {k:c.k,label:c.label,score,src:c.src,color:c.color,w,contrib};
    });
    const weighted=+scores.reduce((s,c)=>s+c.contrib,0).toFixed(1);
    const failedHard=Object.entries(a.restricciones).filter(([,v])=>!v).map(([k])=>HARD_CONSTRAINT_LABELS[k]);
    return {a,scores,weighted,failedHard};
  }).sort((x,y)=>{
    if(x.failedHard.length!==y.failedHard.length) return x.failedHard.length-y.failedHard.length;
    return y.weighted-x.weighted;
  });
  const chosenId=selectedAltId||decisionAltId||null;
  root.innerHTML=`
    <div class="hero"><div class="eye">Sección 5 del documento de alcance</div><h1>Evaluación integral multicriterio</h1>
      <p>Pesos configurables por la entidad. Los cambios se registran en el historial de esta sesión. Las restricciones obligatorias descalifican una alternativa aunque su puntaje sea alto. El resultado es la <b>mejor alternativa integral</b> segun tus pesos — no sustituye la decision formal del decisor.</p>
      <span class="demo-badge">MODO DEMOSTRACIÓN · DATOS SINTÉTICOS</span>
    </div>

    <div class="card card-pad" style="margin-bottom:14px">
      <div class="card-h"><h2>Pesos por criterio</h2><div class="sub">Suma actual: ${totalW}% ${totalW!==100?'(se normaliza automáticamente al ponderar)':''}</div></div>
      <p style="font-size:11.5px;color:var(--muted);margin-bottom:12px;line-height:1.45">
        <span class="multi-src motor">Motor</span> = sale de métricas del simulador (p95).
        <span class="multi-src regla" style="margin-left:6px">Regla demo</span> = heurística fija o campos editoriales de la alternativa — no es sensor de campo.
      </p>

function decide(kind){
  const errBox=document.getElementById('decision-inline-error');
  const reason=(document.getElementById('dr')?.value||'').trim();
  if(reason.length<8){
    if(errBox){errBox.textContent='Escribe una justificación de al menos 8 caracteres antes de decidir.';errBox.style.display='block';}
    document.getElementById('dr')?.focus();
    return;
  }
  if(errBox) errBox.style.display='none';
  if(!lastRun){toast('Corre una simulación antes','warn');return}
  const alts=buildAlternatives();
  const alt=alts.find(a=>a.id===selectedAltId)||alts[0];
  // Barrera dura: nunca aprobar si incumple restricciones obligatorias (coherente con Multicriterio)
  const fails=hardFails(alt);
  if(kind==='aprobada' && fails.length){
    const msg='No se puede aprobar «'+alt.id+'»: incumple restricciones obligatorias. '+
      fails.map(k=>HARD_CONSTRAINT_LABELS[k]).join('; ')+'.';
    if(errBox){errBox.textContent=msg+' Corrige el plan o elige Rechazar / Solicitar ajuste.';errBox.style.display='block';}
    toast('Aprobación bloqueada · restricciones obligatorias','warn');
    return;
  }
  decision=kind;
  decisionReason=reason;
  decisionAltId=alt.id;
  decisionAt=new Date().toISOString();
  // Snapshot inmutable del expediente en el momento de decidir (no se pisa con el estado vivo)
  decisionSnapshot={
    kind,
    altId:alt.id,
    altTitle:alt.title,
    reason,
    at:decisionAt,
    vcMax:alt.vcMax,
    tiempoViaje:alt.tiempoViaje,
    capacidadResidual:alt.capacidadResidual,
    p95:alt.m?alt.m.p95:null,
    viaje:alt.m?alt.m.viaje:null,
    demora:alt.m?alt.m.demora:null,
    max:alt.m?alt.m.max:null,
    L:alt.L?alt.L.slice():null,
    lastRunOff:lastRun&&lastRun.off?lastRun.off.p95:null,
    lastRunOn:lastRun&&lastRun.on?lastRun.on.p95:null,
    conf:lastRun?lastRun.conf:null,
    measures:{desvio:MEASURES.desvio.on,onda:MEASURES.onda.on,ventana:MEASURES.ventana.on},
    shocks:{obra:SHOCKS.obra.on,semaforo:SHOCKS.semaforo.on,evento:SHOCKS.evento.on}
  };
  const label={aprobada:'Aprobada',ajuste:'Ajuste solicitado',rechazada:'Rechazada'}[kind]||kind;
  // Lógica de negocio: al aprobar, activar medidas coherentes con la alternativa
  if(kind==='aprobada'){
    if(alt.id==='ALT-A'){ MEASURES.desvio.on=true; MEASURES.onda.on=true; MEASURES.ventana.on=false; }
    else if(alt.id==='ALT-B'){ MEASURES.desvio.on=false; MEASURES.onda.on=false; MEASURES.ventana.on=true; }
    else if(alt.id==='ALT-C'){ MEASURES.desvio.on=false; MEASURES.onda.on=true; MEASURES.ventana.on=true; }
    // Actualizar snapshot de medidas post-aplicación
    decisionSnapshot.measures={desvio:MEASURES.desvio.on,onda:MEASURES.onda.on,ventana:MEASURES.ventana.on};
  }
  showRecPanel(`<div style="font-size:13px;line-height:1.5"><b>Decisión registrada: ${label}</b><p style="margin-top:8px;color:var(--muted)">${alt.id} · ${alt.title}</p><p style="margin-top:8px">${reason}</p><p style="margin-top:12px;font-size:11px;color:var(--muted)">p95 ${lastRun.off.p95} → ${lastRun.on.p95} · v/c corredor ${alt.vcMax} · índice compuesto ${lastRun.conf}%</p></div>`);
  pushHistory({title:`Decisión: ${label} — ${alt.id}`, detail:reason, act:'decision'}, kind==='aprobada'?'aplicada':kind==='ajuste'?'ajuste':'descartada');
  histOpen=true;
  toast((kind==='aprobada'?'Aprobación simulada: ':'Decisión: ')+label,'ok');
  render();
  // Inmediatez: abrir historial y anclar a la decisión
  setTimeout(()=>{
    const histBody=document.getElementById('ops-hist-body');
    if(histBody) histBody.style.display='block';
    const card=document.getElementById('decision-card');
    if(card) card.scrollIntoView({behavior:'smooth',block:'nearest'});
  },100);
}

function exportHistCSV(){
  if(!opsHistory.length){
    toast('No hay registros en el historial','warn');
    return;
  }
  // Escapar campos CSV (RFC 4180) + preservar tildes/ñ
  const esc=(v)=>{
    const s=String(v??'').replace(/\r\n/g,'\n').replace(/\r/g,'\n');
    return '"'+s.replace(/"/g,'""')+'"';
  };
  const header=['timestamp_iso','hora','accion','detalle','tipo','estado'];
  const rows=[header.map(esc).join(',')];
  opsHistory.forEach(h=>{
    rows.push([
      esc(h.at||''),
      esc(h.time||''),
      esc(h.title||''),
      esc(h.detail||''),
      esc(h.act||''),
      esc(h.status||'')
    ].join(','));
  });
  // BOM UTF-8 para Excel + saltos CRLF compatibles
  const csv='\uFEFF'+rows.join('\r\n')+'\r\n';
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.style.display='none';
  a.href=url;
  const stamp=new Date().toISOString().slice(0,19).replace(/[:T]/g,'-');
  a.download='ViaClara_Historial_Operativo_'+stamp+'.csv';
  document.body.appendChild(a);
  a.click();
  setTimeout(()=>{
    URL.revokeObjectURL(url);
    a.remove();
  }, 400);
  toast('Historial exportado · CSV');
}

function doResetSession(){

  runSim._busy=false;
  if(renderOps._liveTimer){ clearInterval(renderOps._liveTimer); renderOps._liveTimer=null; }
  // Quitar overlays de carga
  document.getElementById('map-loading')?.remove();
  document.getElementById('ops-recalc')?.classList.remove('show');
  // Estado de red por defecto (no borra CSV ya descargados)
  SHOCKS.obra.on=true; SHOCKS.semaforo.on=true; SHOCKS.evento.on=true;
  Object.keys(MEASURES).forEach(k=>MEASURES[k].on=false);
  lastRun=null;
  lastRec=null;
  decision=null;
  decisionReason='';
  decisionAltId=null;
  decisionAt=null;
  decisionSnapshot=null;
  opsHistory=[];

  histFilter='all';
  histQuery='';
  opsHighlight=null;
  OBRAS_OVERRIDE={};
  lastMovedObraId=null;
  lastCalChangeMsg='';
  lastSyncAt=Date.now();
  document.getElementById('stream').innerHTML='';
  openSheet(false);
  document.getElementById('reset-modal')?.classList.remove('show');
  render();
  toast('Sesión reiniciada · red en estado base','ok');
}
